# Builds beleaf for Windows (a Tauri program around the web app) and puts the installer on the
# "windows-test" release: https://github.com/cozycoded/beleaf/releases/tag/windows-test
name: windows app
on:
  push:
    branches: [main]
    paths: ['index.html', 'icons/**', 'desktop/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'desktop/src-tauri -> target' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Tauri tools
        run: npm install -g @tauri-apps/cli@2
      - name: The app itself (same file as the website)
        shell: bash
        run: |
          mkdir -p desktop/dist/icons
          cp index.html desktop/dist/index.html
          cp icons/* desktop/dist/icons/
      - name: Icons
        working-directory: desktop/src-tauri
        run: tauri icon ../../icons/icon-512.png
      - name: Build
        working-directory: desktop/src-tauri
        run: tauri build
      - name: Collect
        shell: bash
        run: |
          mkdir out
          cp desktop/src-tauri/target/release/bundle/nsis/*.exe out/beleaf-setup.exe
          cp desktop/src-tauri/target/release/bundle/msi/*.msi out/beleaf.msi
          ls -la out
      - name: Publish to the windows-test release
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          gh release view windows-test >/dev/null 2>&1 || gh release create windows-test --prerelease --title "beleaf for Windows (test)" --notes "Download beleaf-setup.exe and run it. Rebuilt automatically whenever beleaf changes."
          gh release upload windows-test out/beleaf-setup.exe out/beleaf.msi --clobber
