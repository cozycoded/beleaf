[package]
name = "beleaf-web-engine"
version = "0.1.0"
edition = "2021"
description = "The Rust brush engine for beleaf in the browser: same calls as beleaf's JavaScript engine (begin, add, end, flush, reset), drawn with WebGL2."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
brush-core = { path = "../brush-core" }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "23", features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
console_error_panic_hook = "0.1"
