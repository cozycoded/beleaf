[package]
name = "beleaf-native"
version = "0.1.0"
edition = "2021"
description = "beleaf as a real Android app: the Rust brush engine drawing straight on the graphics card, with the S Pen read directly."

[lib]
name = "beleaf_native"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
brush-core = { path = "../brush-core" }
wgpu = "23"
egui = "0.30"
egui-wgpu = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
serde_json = "1"
png = "0.17"
miniz_oxide = "0.8"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
# pointer history (every S Pen sample between frames) is only on the main branch so far
android-activity = { git = "https://github.com/rust-mobile/android-activity", rev = "b4ddf059b77be12cdb955d394e65a92e7568d936", features = ["native-activity"] }
ndk = { version = "0.9", features = ["rwh_06"] }
raw-window-handle = "0.6"
android_logger = "0.14"
jni = "0.21"

[package.metadata.android]
package = "com.cozycoded.beleaf"
apk_name = "beleaf"
build_targets = ["aarch64-linux-android"]
resources = "res"

# lets beleaf open .beleaf files anywhere on the phone, once you allow "All files access" in Settings
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 34

[package.metadata.android.application]
label = "beleaf"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|keyboard|screenSize|screenLayout|smallestScreenSize|density|uiMode"
launch_mode = "singleTask"

[package.metadata.android.signing.release]
path = "../../.android/beleaf-release.keystore"
keystore_password = "rzyTjRT9N9WJrCVPM57YHarF"
